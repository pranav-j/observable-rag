services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "6333:6333"          # optional, for poking at Qdrant directly

  # one-shot: fetch corpus, chunk, populate Qdrant + write bm25/chunks to the shared volume
  build:
    build: .
    command: python -m observable_rag.index.build
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - app-data:/app/data
      - hf-cache:/root/.cache/huggingface

  api:
    build: .
    depends_on:
      qdrant:
        condition: service_started
      build:
        condition: service_completed_successfully   # serve only after the index exists
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - app-data:/app/data
      - hf-cache:/root/.cache/huggingface

volumes:
  qdrant-storage:
  app-data:
  hf-cache: