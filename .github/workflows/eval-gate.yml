name: rag-eval-gate
on: pull_request

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[eval,dev]"
      - name: Run tests
        run: pytest -q
      - name: Build the full index from the corpus
        run: python -m observable_rag.index.build   # full corpus: golden set references chunks across it
      - name: Run eval harness
        run: python eval/evaluate.py --golden data/eval/golden_set.jsonl --out eval_report.json
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OPENAI_MODEL: gpt-4o-mini   # uncomment/set if your account needs a specific model
      - name: Gate on regression vs baseline
        run: python eval/ci_gate.py --baseline data/eval/baseline.json --current eval_report.json