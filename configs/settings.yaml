# Runtime + evaluation configuration.

retrieval:
  top_k_vector: 20
  top_k_bm25: 20
  rrf_k: 60            # reciprocal-rank-fusion constant
  rerank_top_n: 5      # chunks passed to the generator

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

rerank:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

generation:
  model: gpt-4o-mini
  abstain_message: "The documentation does not cover this."

chunking:
  max_tokens: 512
  overlap_tokens: 64

# Relative-regression margins for the CI gate (mirror eval/ci_gate.py).
gate:
  recall_at_5: 0.03
  context_precision_at_5: 0.03
  faithfulness: 0.03
  answer_relevance: 0.03
  false_answer_rate: 0.02
  p95_latency_ms: 150
