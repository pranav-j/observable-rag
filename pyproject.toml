[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observable-rag"
version = "0.1.0"
description = "Observable RAG: hybrid retrieval, citation-enforced answers, CI-gated evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "tiktoken",
  "qdrant-client",
  "rank-bm25",
  "sentence-transformers",
  "openai",
  "arize-phoenix",
]

[project.optional-dependencies]
# The eval harness deliberately has no extra dependencies: its metrics are
# stdlib, so they can't break when a fast-moving judge library changes under
# them. The extra is kept so `pip install -e ".[eval,dev]"` still works.
eval = []
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/observable_rag"]

[tool.ruff]
line-length = 100

# Pinned so CI and a local run agree; without a select here ruff falls back to
# whatever the developer's global config happens to say.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
